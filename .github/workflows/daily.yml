name: Daily Quran Shorts
on:
  schedule:            # UTC. Cairo is UTC+2 in winter: 14:00, 19:00, 23:00 Cairo
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install pillow
      - name: Render and upload
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          H=$(date -u +%H); SLOT=0; [ "$H" -ge 16 ] && SLOT=1; [ "$H" -ge 20 ] && SLOT=2
          SLOT=$SLOT python3 upload.py
