name: Post due Shorts
on:
  schedule:
    - cron: "*/15 * * * *"   # checks every 15 min; only renders when a channel's own posting time is due
  workflow_dispatch:
concurrency: { group: post, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site what is due
        env: { SITE_URL: "${{ secrets.SITE_URL }}", RUNNER_TOKEN: "${{ secrets.RUNNER_TOKEN }}" }
        run: |
          curl -fsS -A shorts-runner/1.0 -H "Authorization: Bearer $RUNNER_TOKEN" "$SITE_URL/api/due" -o /tmp/due.json
          python3 -c "import json;n=len(json.load(open('/tmp/due.json')));print('due:',n);open('/tmp/n','w').write(str(n))"
          echo "DUE=$(cat /tmp/n)" >> $GITHUB_ENV
      - if: env.DUE != '0'
        uses: actions/checkout@v4
      - if: env.DUE != '0'
        run: pip install pillow && (ffmpeg -version | head -1)
      - if: env.DUE != '0'
        name: Render and upload
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          DUE_FILE=/tmp/due.json python3 upload.py
